name: Deploy Q Brands educational demo

on:
  push:
    branches: [s8]
    paths-ignore:
      - 'dist/**'
      - 'dist-ssr/**'
      - 'build/**'
      - 'coverage/**'
      - 'node_modules/**'
      - 'test-results/**'
      - 'playwright-report/**'
      - '*.local'
      - '.env*'
  pull_request:
    branches: [s8]
    paths-ignore:
      - 'dist/**'
      - 'dist-ssr/**'
      - 'build/**'
      - 'coverage/**'
      - 'node_modules/**'
      - 'test-results/**'
      - 'playwright-report/**'
      - '*.local'
      - '.env*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VITE_BASE_PATH: /
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Browser tests
        run: npm run test:e2e

      - name: Lint
        run: npm run lint

      - name: Build static project site
        run: npm run build
        env:
          VITE_BASE_PATH: /DF_I-Fundamentos_HTML_CSS/

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    environment:
      name: github-pages
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: s8

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static project site
        run: npm run build
        env:
          VITE_BASE_PATH: /DF_I-Fundamentos_HTML_CSS/

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
